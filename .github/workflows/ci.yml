name: CI

# Runs on every PR (any target branch) + pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token (status checks only need read).
permissions:
  contents: read

# Fail-fast: cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── Backend (.NET 10) ─────────────────────────
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocAnalytics.slnx

      - name: Build
        run: dotnet build DocAnalytics.slnx --no-restore --configuration Release

      # Fast gate = 4 correctness projects (Round 0 decision).
      # Performance.Tests is intentionally EXCLUDED from the blocking gate.
      # bash runs with -eo pipefail, so the first failing project stops the job (fail-fast).
      - name: Test (correctness projects)
        run: |
          dotnet test DocAnalytics.Domain.Tests/DocAnalytics.Domain.Tests.csproj   --no-build --configuration Release
          dotnet test DocAnalytics.Data.Tests/DocAnalytics.Data.Tests.csproj       --no-build --configuration Release
          dotnet test DocAnalytics.Service.Tests/DocAnalytics.Service.Tests.csproj --no-build --configuration Release
          dotnet test DocAnalytics.Api.Tests/DocAnalytics.Api.Tests.csproj         --no-build --configuration Release

  # ──────────────────────── Frontend (Angular 22) ────────────────────────
  # Runs in PARALLEL with `backend` (no `needs:` dependency between them).
  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docanalytics-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docanalytics-web/package-lock.json

      - name: Install (clean)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (Vitest, single run)
        run: npx ng test --watch=false

  devsecops:
    name: devsecops (secrets + deps + image scan)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # Secret scan (gitleaks) — SCAN WORKING TREE ONLY (no git history)
      # --------------------
      - name: Gitleaks (working tree only)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""
        with:
          args: >
            detect
            --no-git
            --redact
            --config=.gitleaks.toml

      # --------------------
      # Backend dependency scan (.NET)
      # --------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet list package --vulnerable (fail on any)
        shell: bash
        run: |
          set -euo pipefail
          dotnet list DocAnalytics.slnx package --vulnerable --include-transitive | tee dotnet-vuln.txt
          # Fail if the command reports vulnerable packages
          if grep -qi "has the following vulnerable packages" dotnet-vuln.txt; then
            echo "❌ Vulnerable NuGet packages detected"
            exit 1
          fi

      # --------------------
      # Frontend dependency scan (npm)
      # --------------------
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (HIGH+)
        working-directory: docanalytics-web
        run: |
          npm ci
          npm audit --audit-level=high

      # --------------------
      # Container image scan (Trivy)
      # Build images locally (no push), scan HIGH/CRITICAL
      # --------------------
      - name: Build API image
        run: |
          docker build -t docanalytics-api:${{ github.sha }} -f DocAnalytics.Api/Dockerfile .

      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: docanalytics-api:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - name: Build Web image
        run: |
          docker build -t docanalytics-web:${{ github.sha }} -f docanalytics-web/Dockerfile docanalytics-web

      - name: Trivy scan (Web image)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: docanalytics-web:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

