version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: [ "*" ]

  - package-ecosystem: "npm"
    directory: "/docanalytics-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docanalytics-web"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns:
          - "@angular/*"
