<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="brand">DocAnalytics</h1>
    <p class="subtitle">Choose a new password</p>

    @if (missingToken()) {
    <div class="alert" role="alert">This reset link is invalid or incomplete. Please request a new one.</div>
    <a class="link" routerLink="/forgot-password">Request a new link</a>
    } @else if (success()) {
    <div class="alert" role="status">Your password has been reset. Redirecting to sign in…</div>
    } @else {
    @if (errorMessage()) {
    <div class="alert" role="alert">{{ errorMessage() }}</div>
    }

    <label class="field">
      <span class="label">New password</span>
      <input type="password"
             formControlName="newPassword"
             autocomplete="new-password"
             placeholder="••••••••"
             [class.invalid]="isInvalid('newPassword')" />
      @if (isInvalid('newPassword')) {
      <span class="hint">
        @if (form.controls.newPassword.hasError('required')) {
        Password is required.
        } @else {
        At least 8 characters.
        }
      </span>
      }
    </label>

    <label class="field">
      <span class="label">Confirm password</span>
      <input type="password"
             formControlName="confirmPassword"
             autocomplete="new-password"
             placeholder="••••••••"
             [class.invalid]="isInvalid('confirmPassword')" />
      @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
      <span class="hint">Passwords do not match.</span>
      }
    </label>

    <button type="submit" class="btn" [disabled]="loading()">
      @if (loading()) {
      <span class="spinner" aria-hidden="true"></span> Resetting…
      } @else {
      Reset password
      }
    </button>
    }
  </form>
</div>
