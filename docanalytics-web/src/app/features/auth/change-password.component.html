<div class="login-wrap">
  <form class="login-card" (ngSubmit)="submit()" novalidate>
    <h1 class="brand">DocAnalytics</h1>
    <p class="subtitle">Set a new password to continue</p>

    @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
    }

    <label class="field">
      <span class="label">Current (temporary) password</span>
      <input type="password" name="current" [(ngModel)]="current" autocomplete="current-password" />
    </label>
    <label class="field">
      <span class="label">New password (min 10 chars)</span>
      <input type="password" name="next" [(ngModel)]="next" autocomplete="new-password" />
    </label>
    <label class="field">
      <span class="label">Confirm new password</span>
      <input type="password" name="confirm" [(ngModel)]="confirm" autocomplete="new-password" />
    </label>

    <button type="submit" class="btn" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner" aria-hidden="true"></span> Saving…
      } @else {
        Change password
      }
    </button>
  </form>
</div>
