<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="brand">DocAnalytics</h1>

    @if (submitted()) {
    <div class="alert" role="status">
      If an account exists for that email, we've sent a reset link. Please check your inbox.
    </div>
    <a class="link" routerLink="/login">← Back to sign in</a>
    } @else {
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <label class="field">
      <span class="label">Email</span>
      <input type="email"
             formControlName="email"
             autocomplete="username"
             placeholder="you@company.com"
             [class.invalid]="isInvalid('email')" />
      @if (isInvalid('email')) {
      <span class="hint">
        @if (form.controls.email.hasError('required')) {
        Email is required.
        } @else {
        Enter a valid email address.
        }
      </span>
      }
    </label>

    <button type="submit" class="btn" [disabled]="loading()">
      @if (loading()) {
      <span class="spinner" aria-hidden="true"></span> Sending…
      } @else {
      Send reset link
      }
    </button>

    <a class="link" routerLink="/login">← Back to sign in</a>
    }
  </form>
</div>
