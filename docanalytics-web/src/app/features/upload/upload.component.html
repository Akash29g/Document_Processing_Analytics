<section class="up">
  <header class="up-head">
    <p class="up-eyebrow">Invoices</p>
    <h2 class="up-title">Upload Invoice</h2>
    <p class="up-sub">Drop a PDF invoice — it's stored in S3 and extracted automatically.</p>
  </header>

  <label class="up-drop"
         [class.drag]="dragging()"
         (dragover)="$event.preventDefault(); dragging.set(true)"
         (dragleave)="dragging.set(false)"
         (drop)="onDrop($event)">
    <input type="file" accept="application/pdf" hidden (change)="onPick($event)" />
    @if (svc.uploading()) {
    <span class="up-spinner"></span>
    <span>Uploading “{{ fileName() }}”…</span>
    } @else {
    <span class="up-icon">⬆️</span>
    <span><strong>Click to choose</strong> or drag a PDF here</span>
    }
  </label>

  @if (svc.lastFileId(); as id) {
  <p class="up-done">✅ Uploaded. It'll appear under <strong>Batches</strong> (source: Manual_Upload) once extracted.</p>
  }
  @if (svc.error()) { <p class="up-err">⚠️ {{ svc.error() }}</p> }
</section>
