version: 2
updates:
  # ---- Backend: NuGet (.NET) ----
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # ---- Frontend: npm (Angular app) ----
  - package-ecosystem: "npm"
    directory: "/docanalytics-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
